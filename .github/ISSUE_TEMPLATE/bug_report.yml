name: Bug report
description: Report a reproducible defect without secrets
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and sanitized evidence
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, Node and commit
